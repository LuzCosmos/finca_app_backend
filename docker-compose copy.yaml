services:
  # Database
  postgres:
    container_name: finca_app_postgres
    image: postgis/postgis:17-3.4
    restart: unless-stopped
    ports:
      - '${FA_DB_PORT}:5432'
    environment:
      POSTGRES_DB: ${FA_DB_NAME}
      POSTGRES_USER: ${FA_DB_USER}
      POSTGRES_PASSWORD: ${FA_DB_PASSWORD}
    volumes:
      - ${BASE_PATH}/${ENVIRONMENT}-srv/docker-data/fa-database:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - finca_app_net
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${FA_DB_USER} -d ${FA_DB_NAME}' ]
      interval: 120s
      timeout: 30s
      retries: 2

  # Redis
  redis:
    image: redis:7.4-alpine
    container_name: fa_redis_server
    restart: unless-stopped
    command: >
      redis-server --requirepass ${FA_REDIS_PASSWORD} --appendonly yes --appendfsync everysec
    ports:
      - '${FA_REDIS_PORT}:6379'
    volumes:
      - ${BASE_PATH}/${ENVIRONMENT}-srv/docker-data/fa-redis:/data
    networks:
      - finca_app_net
    environment:
      - REDIS_PASSWORD=${FA_REDIS_PASSWORD}

  # Backend API
  backend:
    container_name: finca_app_backend
    image: finca_app_backend:1
    restart: unless-stopped
    ports:
      - '${APP_PORT_EXTERNAL}:3000'
    env_file:
      - .env
    environment:
      # Overrides or variables not in .env if any, otherwise this section can be minimal
      - NODE_ENV=${NODE_ENV:-production}
      - APP_PORT=3000 # Force internal port to 3000, needed because .env has the generic/host port (e.g. 23000)
      # Explicitly mapping host vars if they are expected to be different from .env content
      # But usually env_file covers it.
      # Keeping database connection explicit is sometimes safer if they rely on shell env vs .env file
      # efficiently, env_file loads the file.
      # The user wants to use data from .env in docker-compose by each environment.
      # So we assume the .env file present in the directory is the one we want.
    volumes:
      - ${BASE_PATH}/${ENVIRONMENT}-srv/docker-data/fa-uploads:/app/uploads
    networks:
      - finca_app_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:${APP_PORT}/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
networks:
  finca_app_net:
    name: '${ENVIRONMENT}_finca_app_net'
    driver: bridge

