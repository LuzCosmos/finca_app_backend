services:
  # Database
  postgres:
    container_name: finca_app_postgres
    image: postgis/postgis:17-3.4
    restart: unless-stopped
    ports:
      - '${FA_DB_PORT}:5432'
    environment:
      POSTGRES_DB: ${FA_DB_NAME}
      POSTGRES_USER: ${FA_DB_USER}
      POSTGRES_PASSWORD: ${FA_DB_PASSWORD}
    volumes:
      - ${BASE_PATH}/${ENVIRONMENT}-srv/docker-data/fa-database:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    networks:
      - finca_app_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${FA_DB_USER} -d ${FA_DB_NAME}']
      interval: 120s
      timeout: 30s
      retries: 2

  # Redis
  redis:
    image: redis:7.4-alpine
    container_name: fa_redis_server
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${FA_REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    ports:
      - '${FA_REDIS_PORT}:6379'
    volumes:
      - ${BASE_PATH}/${ENVIRONMENT}-srv/docker-data/fa-redis:/data
    networks:
      - finca_app_net
    environment:
      - REDIS_PASSWORD=${FA_REDIS_PASSWORD}

  # API
  api:
    build:
      context: ./finca_app_backend
      dockerfile: Dockerfile
    image: finca-api:${ENVIRONMENT}
    container_name: ${ENVIRONMENT}_finca_api
    env_file:
      - ${ENV_FILE:?Define ENV_FILE=.env}
    environment:
      NODE_ENV: production
      FA_DB_HOST: postgres # dentro de la red Docker
      FA_DB_PORT: ${FA_DB_PORT}
      FA_REDIS_HOST: ${FA_REDIS_HOST}
      FA_REDIS_PORT: ${FA_REDIS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '${APP_PORT}:3000'
    restart: unless-stopped

networks:
  finca_app_net:
    name: '${ENVIRONMENT}_finca_app_net'
    driver: bridge
