services:
  redis:
    image: redis:latest
    container_name: fa_redis_server
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - fa_redisdata:/data
    networks:
      - finca_app_network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

volumes:
  fa_redisdata:

networks:
  finca_app_network:
    driver: bridge