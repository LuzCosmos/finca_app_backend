services:
  redis:
    image: redis:7.4-alpine
    container_name: fa_redis_server
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - /${ENVIRONMENT}-srv/docker-data/fa-redis:/data
    networks:
      - finca_app_network
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

networks:
  finca_app_net:
    external: true
